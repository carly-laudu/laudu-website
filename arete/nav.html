<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aretē — Navigation</title>
<style>
  @font-face{font-family:"Ivy Presto Display";src:url("https://static.wixstatic.com/ufonts/607006_ccd50e22c2d8440a83b45cd1954b70ab/woff2/file.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap;}
  @font-face{font-family:"Neue Haas Grotesk";src:url("https://static.wixstatic.com/ufonts/dd852a_d6bbd1dfc40b407586bbf6bc5085dcfd/woff2/file.woff2") format("woff2");font-weight:100 400;font-style:normal;font-display:swap;}
  @font-face{font-family:"Neue Haas Grotesk";src:url("https://static.wixstatic.com/ufonts/a7f197_7914746ba43a4b6092a2faa3147c3f61/woff2/file.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}

  :root{
    --olive:#5f6355; --moss:#4d523d; --beige:#d6c9ba; --cream:#fcf5eb; --charcoal:#1c1c1c;
    --ink:#292929; --muted:#8c8073; --hair:rgba(41,41,41,.14); --subtle:rgba(41,41,41,.22);
    --ease:cubic-bezier(.22,.61,.36,1);
    --display:"Ivy Presto Display","Times New Roman",serif;
    --sans:"Neue Haas Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:transparent;-webkit-font-smoothing:antialiased;font-family:var(--sans);}
  /* click-through: only the bar (and its dropdowns) and the drawer take clicks;
     everywhere else the pointer falls through to the page beneath */
  body{pointer-events:none;}
  .bar,.subbar,.drawer{pointer-events:auto;}
  a{text-decoration:none;color:inherit;}
  button{font:inherit;background:none;border:0;cursor:pointer;color:inherit;}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:0 clamp(20px,4vw,48px);height:76px;background:rgba(252,245,235,.92);
    backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
    border-bottom:1px solid var(--hair);}
  .brand{flex:none;display:inline-flex;align-items:center;}
  .brand img{height:21px;}

  .nav{display:flex;align-items:center;gap:clamp(14px,1.8vw,30px);flex:1;justify-content:center;}
  .navlink{position:relative;font-weight:500;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    white-space:nowrap;color:var(--ink);opacity:.7;padding:6px 0;display:inline-flex;align-items:center;gap:7px;transition:opacity .2s var(--ease);}
  .navlink:hover,.item:hover .navlink{opacity:1;}
  .navlink .ul{position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--olive);transform:scaleX(0);transform-origin:center;transition:transform .3s var(--ease);}
  .item:hover .navlink .ul,.navlink.active .ul{transform:scaleX(1);}
  .chev{transition:transform .3s var(--ease);}
  .item.open .chev{transform:rotate(180deg);}

  .actions{flex:none;display:flex;align-items:center;gap:clamp(14px,1.6vw,24px);}
  .btn{font-weight:500;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;
    border:1px solid var(--olive);background:var(--olive);color:var(--cream);transition:all .18s var(--ease);white-space:nowrap;}
  .btn:hover{background:var(--moss);border-color:var(--moss);}

  .item{position:relative;}
  .menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);min-width:232px;margin-top:14px;
    background:rgba(252,245,235,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--hair);box-shadow:0 28px 60px -36px rgba(41,41,41,.5);padding:10px;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease),visibility .28s;}
  .menu::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px;}
  .item.open .menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .menu a{display:block;font-weight:400;font-size:.92rem;letter-spacing:.01em;color:var(--ink);padding:12px 14px;border-radius:2px;transition:background .15s var(--ease),color .15s var(--ease);}
  .menu a .sub{display:block;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .menu a:hover{background:rgba(95,99,85,.1);color:var(--moss);}

  .acct{position:relative;display:inline-flex;align-items:center;gap:10px;}
  .acct-trig{display:inline-flex;align-items:center;gap:10px;color:var(--ink);}
  .acct-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--subtle);color:var(--ink);flex:none;}
  .acct-name{font-weight:300;font-size:.95rem;letter-spacing:.01em;white-space:nowrap;}
  .acct-menu{position:absolute;top:100%;right:0;min-width:240px;margin-top:14px;background:var(--charcoal);
    border:1px solid rgba(252,245,235,.08);box-shadow:0 34px 72px -34px rgba(0,0,0,.7);padding:16px 22px 14px;text-align:right;
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);transition:opacity .28s var(--ease),transform .28s var(--ease),visibility .28s;}
  .acct-menu::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px;}
  .acct.open .acct-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);}
  .acct-lead{font-weight:400;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#6f6f6a;padding:14px 0 4px;}
  .acct-link{display:block;font-weight:300;font-size:1rem;letter-spacing:.01em;color:#f3ede3;padding:6px 0;transition:color .15s var(--ease);}
  .acct-link:hover{color:var(--beige);}
  .acct-div{height:1px;background:rgba(252,245,235,.14);margin:12px 0 4px;}

  .burger{display:none;flex-direction:column;gap:6px;padding:6px;flex:none;}
  .burger span{display:block;width:26px;height:1.5px;background:var(--ink);}
  .drawer{position:fixed;inset:0;z-index:90;background:var(--charcoal);display:flex;flex-direction:column;
    padding:22px clamp(20px,6vw,40px) 36px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);overflow-y:auto;}
  .drawer.open{opacity:1;pointer-events:auto;}
  .drawer-top{display:flex;align-items:center;justify-content:space-between;}
  .drawer-top img{height:20px;}
  .drawer-x{color:var(--cream);font-family:var(--display);font-size:30px;line-height:1;}
  .drawer-nav{display:flex;flex-direction:column;gap:4px;margin-top:24px;}
  .drawer-nav a,.drawer-sec>button{display:block;font-family:var(--display);font-weight:300;font-size:1.7rem;
    letter-spacing:-.01em;color:var(--cream);padding:10px 0;text-align:left;width:100%;}
  .drawer-sub{padding-left:16px;}
  .drawer-sub a{font-family:var(--sans);font-weight:400;font-size:.95rem;letter-spacing:.02em;color:rgba(252,245,235,.6);padding:7px 0;}
  .drawer-foot{margin-top:auto;padding-top:24px;border-top:1px solid rgba(252,245,235,.18);display:flex;flex-direction:column;gap:14px;}
  .drawer-foot .acct-lead{text-align:left;color:rgba(252,245,235,.55);}


  /* horizontal sub-bar (replaces drop-down panels) */
  .subbar{display:none;align-items:center;gap:clamp(18px,2.4vw,34px);
    padding:0 clamp(20px,4vw,48px);height:54px;background:rgba(252,245,235,.97);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--hair);}
  .subbar.show{display:flex;}
  .subbar.right{justify-content:flex-end;}
  .subbar a,.subbar button{font-weight:400;font-size:.88rem;letter-spacing:.02em;color:var(--ink);
    opacity:.75;white-space:nowrap;transition:opacity .15s var(--ease),color .15s var(--ease);}
  .subbar a:hover,.subbar button:hover{opacity:1;color:var(--moss);}
  .subbar .sub{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:7px;}

  @media (max-width:1080px){ .nav,.actions{display:none;} .burger{display:flex;} }
</style>
</head>

var BASE = "";
var TOP = [
  { label:"Membership", href:"/membership" },
  { label:"Forum Editions", href:"/forum" },
  { label:"Timeless Editorial", menu:[
    { label:"L’Héritage", href:"/editorial", sub:"The Imprint" },
    { label:"The Library", href:"/library", sub:"Members’ Editorial" }
  ]},
  { label:"About", menu:[
    { label:"The Team", href:"/theteam" },
    { label:"Voices", href:"/voices" },
    { label:"Press", href:"/press" }
  ]}
];

/* The public profile dynamic page, e.g. /profile/alberto-brazzalotto-b44f3f.
   ensureProfile() writes the slug as full-name-<first 6 of member._id>. Normally
   Velo resolves the whole URL and sends it as profileUrl; this is the fallback
   for when only a bare slug is bridged across. */
var PROFILE_ROUTE = "/profile/{slug}";
/* Where a member goes when no profile URL can be resolved: /my-profile is the
   edit page, so someone without a profile row can go and fill one in. */
var ACCOUNT_FALLBACK = "/my-profile";

function accountModel(){
  return [
    { label:"My Profile", href:profileHref(), profile:true },
    { label:"The Members", href:"/the-collective" }, /* swap to /the-collective at launch */
    { label:"Events", href:"/event-list" },
    { label:"Log Out", logout:true }
  ];
}

var STATE = { member:false, name:"", slug:"", profileUrl:"", bridged:false };
var BASE_H = 76;
var SUB_H = 55;
var openKey = null;

function post(m){ try{ if(window.parent && window.parent!==window) window.parent.postMessage(m,"*"); }catch(e){} }
window.addEventListener("message", function(e){
  var d = e.data; if(!d||typeof d!=="object") return;
  if(d.type==="aretenav:member"){ STATE.bridged=true; STATE.member=!!d.loggedIn; STATE.name=d.name||""; STATE.slug=d.slug||""; STATE.profileUrl=d.profileUrl||""; openKey=null; render(); }
});
function reqLogin(){ if(STATE.bridged) post({type:"aretenav:login"}); }
function reqLogout(){ if(STATE.bridged) post({type:"aretenav:logout"}); else { STATE.member=false; render(); } }
function sendHeight(px){ post({ type:"aretenav:height", px:Math.ceil(px) }); }
function go(href){
  if(!href) return;
  post({ type:"aretenav:nav", href:href });
  if(window.parent === window){ location.href = href; }
}
/* The member's own profile lives at a slug-specific URL, so it is resolved at
   click time rather than baked into the menu markup. */
function profileHref(){
  if(STATE.profileUrl) return STATE.profileUrl;
  if(STATE.slug) return PROFILE_ROUTE.replace("{slug}", encodeURIComponent(STATE.slug));
  return "";
}
function goProfile(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  var href = profileHref();
  if(href){ go(href); openKey=null; updateSub(); closeDrawer(); return; }
  /* No slug yet: ask the parent to look the current member up and route there. */
  if(STATE.bridged) post({ type:"aretenav:profile" });
  else go(ACCOUNT_FALLBACK);
  openKey=null; updateSub(); closeDrawer();
}
document.addEventListener("click", function(e){
  var a = e.target.closest('a[href]');
  if(a){ var hh=a.getAttribute("href"); if(hh && hh.charAt(0)==="/"){ e.preventDefault(); go(hh); } }
}, true);

function navLinks(){
  return TOP.map(function(t,i){
    if(t.menu){
      return '<div class="item" data-i="'+i+'"><button class="navlink" onclick="toggleSub(\'t'+i+'\',event)">'+t.label
        + ' <svg class="chev" width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 3.5L5 7l3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '<span class="ul"></span></button></div>';
    }
    return '<div class="item"><a class="navlink" href="'+BASE+t.href+'" target="_top">'+t.label+'<span class="ul"></span></a></div>';
  }).join("");
}
function actions(){
  if(STATE.member){
    return '<div class="acct" id="acct"><button class="acct-trig" onclick="toggleSub(\'acct\',event)">'
      + '<span class="acct-avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.3"/><path d="M5 19.5c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>'
      + '<span class="acct-name">Hello '+(STATE.name||"Member")+'</span>'
      + '<svg class="chev" width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 3.5L5 7l3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '</button></div>';
  }
  return '<button class="navlink" style="opacity:.7" onclick="reqLogin()">Log In</button>'
    + '<a class="btn" href="'+BASE+'/apply" target="_top">Apply</a>';
}
function subContent(key){
  if(key==="acct"){
    return accountModel().map(function(a){
      if(a.logout) return '<button onclick="reqLogout()">Log Out</button>';
      if(a.profile && !a.href) return '<button onclick="goProfile(event)">'+a.label+'</button>';
      return '<a href="'+BASE+a.href+'" target="_top">'+a.label+'</a>';
    }).join("");
  }
  var i = parseInt(key.slice(1),10);
  var t = TOP[i]; if(!t || !t.menu) return "";
  return t.menu.map(function(m){
    return '<a href="'+BASE+m.href+'" target="_top">'+m.label+(m.sub?'<span class="sub">'+m.sub+'</span>':'')+'</a>';
  }).join("");
}
function updateSub(){
  var sb = document.getElementById("subbar");
  if(!sb) return;
  document.querySelectorAll(".item.open").forEach(function(el){ el.classList.remove("open"); });
  var acct = document.getElementById("acct"); if(acct) acct.classList.remove("open");
  if(!openKey){ sb.className="subbar"; sb.innerHTML=""; sendHeight(BASE_H); return; }
  sb.innerHTML = subContent(openKey);
  sb.className = "subbar show" + (openKey==="acct" ? " right" : "");
  if(openKey==="acct" && acct) acct.classList.add("open");
  if(openKey.charAt(0)==="t"){ var it=document.querySelector('.item[data-i="'+openKey.slice(1)+'"]'); if(it) it.classList.add("open"); }
  sendHeight(BASE_H + SUB_H);
}
function toggleSub(key,e){ if(e) e.stopPropagation();
  openKey = (openKey===key) ? null : key;
  updateSub();
}
document.addEventListener("click", function(){ if(openKey){ openKey=null; updateSub(); } });

function drawerNav(){
  var top = TOP.map(function(t,i){
    if(t.menu){
      var subs = t.menu.map(function(m){ return '<a href="'+BASE+m.href+'" target="_top">'+m.label+'</a>'; }).join("");
      return '<div class="drawer-sec"><button onclick="toggleDrawerSec('+i+')">'+t.label+'</button><div class="drawer-sub" id="dsec'+i+'" style="display:none">'+subs+'</div></div>';
    }
    return '<a href="'+BASE+t.href+'" target="_top">'+t.label+'</a>';
  }).join("");
  var foot;
  if(STATE.member){
    var rows = accountModel().map(function(a){
      if(a.logout) return '<button class="acct-link" style="text-align:left;font-size:1rem" onclick="reqLogout()">Log Out</button>';
      if(a.profile && !a.href) return '<button class="acct-link" style="text-align:left;font-size:.95rem;color:rgba(252,245,235,.6)" onclick="goProfile(event)">'+a.label+'</button>';
      return '<a class="drawer-sub" style="padding-left:0" href="'+BASE+a.href+'" target="_top">'+a.label+'</a>';
    }).join("");
    foot = '<div class="acct-lead">Hello '+(STATE.name||"Member")+'</div>'+rows;
  } else {
    foot = '<button class="acct-link" style="text-align:left;color:rgba(252,245,235,.7);font-size:1rem" onclick="reqLogin()">Log In</button>'
      + '<a class="btn" style="text-align:center" href="'+BASE+'/apply" target="_top">Apply for Membership</a>';
  }
  return '<div class="drawer" id="drawer"><div class="drawer-top"><img src="'+WM_BEIGE+'" alt="Aretē"><button class="drawer-x" onclick="closeDrawer()">×</button></div>'
    + '<nav class="drawer-nav">'+top+'</nav><div class="drawer-foot">'+foot+'</div></div>';
}

function render(){
  document.getElementById("nav").innerHTML =
    '<div class="bar"><a class="brand" href="'+BASE+'/" target="_top"><img src="'+WM_OLIVE+'" alt="Aretē"></a>'
    + '<nav class="nav">'+navLinks()+'</nav>'
    + '<div class="actions">'+actions()+'</div>'
    + '<button class="burger" aria-label="Menu" onclick="openDrawer()"><span></span><span></span></button></div>'
    + '<div class="subbar" id="subbar"></div>'
    + drawerNav();
  sendHeight(BASE_H);
}

function openDrawer(){ document.getElementById("drawer").classList.add("open"); sendHeight(900); }
function closeDrawer(){ var d=document.getElementById("drawer"); if(d) d.classList.remove("open"); sendHeight(BASE_H); }
function toggleDrawerSec(i){ var s=document.getElementById("dsec"+i); s.style.display = s.style.display==="none"?"block":"none"; }

render();
post({ type:"aretenav:ready" });
window.addEventListener("resize", function(){ if(!openKey && !document.querySelector(".drawer.open")) sendHeight(BASE_H); });
</script>
</body>
</html>
