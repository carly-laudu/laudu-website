  --accent:#f86801;--accent-fg:#06091a;
  --hair:rgba(244,241,234,.12);--hair2:rgba(244,241,234,.22);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'TWK Lausanne','Helvetica Neue',Arial,sans-serif;
}
html,body{background:var(--navy);color:var(--fg);font-family:var(--font);
  font-weight:300;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
@media(max-width:640px){.wrap{padding:0 20px}}

.hero{padding:72px 0 64px;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-20%;right:-5%;width:60vw;height:60vw;
  max-width:800px;background:radial-gradient(closest-side,rgba(248,104,1,.22),rgba(248,104,1,.06) 45%,transparent 70%);
  filter:blur(18px);pointer-events:none}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr 1fr;gap:64px;align-items:end}
.hero-eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--fg2);margin-bottom:32px}
.hero-eyebrow .rule{width:40px;height:1px;background:var(--hair2)}
.hero h1{font-size:clamp(44px,7vw,100px);line-height:.96;letter-spacing:-.02em;
  font-weight:200;text-wrap:balance}
.hero h1 .em{color:var(--accent);font-style:italic}
.hero-body p{color:var(--fg2);font-size:17px;line-height:1.6;max-width:40ch;margin-bottom:24px}
.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 28px;
  border-top:1px solid var(--hair);padding-top:20px}
.stat .v{font-size:26px;font-weight:200;letter-spacing:-.01em;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3)}
@media(max-width:860px){.hero-inner{grid-template-columns:1fr;gap:36px}}

.section{padding:72px 0}
.section-head{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:20px;
  padding-bottom:40px;border-bottom:1px solid var(--hair);margin-bottom:48px}
.section-num{font-size:13px;letter-spacing:.14em;color:var(--fg3);font-variant-numeric:tabular-nums}
.section-num strong{color:var(--fg);font-weight:300}
.section-head h2{font-size:clamp(24px,3vw,42px);font-weight:200;text-transform:uppercase;letter-spacing:-.005em;line-height:1}
.section-meta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3)}
@media(max-width:640px){.section-head{grid-template-columns:1fr;gap:12px;padding-bottom:20px;margin-bottom:28px}}

.filter{display:flex;align-items:center;gap:4px;margin-bottom:48px;
  border:1px solid var(--hair);padding:4px;border-radius:4px;width:max-content;flex-wrap:wrap}
.filter button{background:transparent;color:var(--fg2);border:0;padding:9px 16px;cursor:pointer;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px;
  font-family:inherit;transition:all 240ms var(--ease)}
.filter button:hover{color:var(--fg)}
.filter button.on{background:var(--fg);color:#06091a}
.filter .ct{margin-left:6px;opacity:.5;font-variant-numeric:tabular-nums}

.grid{display:grid;gap:48px 32px}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:960px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.g3{grid-template-columns:1fr;gap:36px}}

.card{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card-img{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--navy2);border:1px solid var(--hair)}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.85)contrast(1.02)brightness(.94);
  transition:filter 480ms var(--ease),transform 900ms var(--ease)}
.card:hover .card-img img{filter:saturate(1)contrast(1.05)brightness(1.02);transform:scale(1.03)}
.card-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(6,9,26,.85));pointer-events:none}
.card-num{position:absolute;top:14px;left:14px;z-index:2;font-size:11px;
  letter-spacing:.18em;color:var(--fg2);font-variant-numeric:tabular-nums;mix-blend-mode:difference}
.card-plus{position:absolute;bottom:14px;right:14px;z-index:2;width:34px;height:34px;
  border:1px solid var(--hair2);border-radius:999px;display:grid;place-items:center;
  background:rgba(9,16,40,.5);backdrop-filter:blur(8px);transition:all 240ms var(--ease)}
.card-plus svg{width:13px;height:13px;stroke:var(--fg);stroke-width:1.25;fill:none}
.card:hover .card-plus{background:var(--accent);border-color:var(--accent)}
.card:hover .card-plus svg{stroke:var(--accent-fg)}
.card-body{padding-top:16px;border-top:1px solid var(--hair);margin-top:10px;
  transition:border-color 240ms var(--ease)}
.card:hover .card-body{border-top-color:var(--accent)}
.card-role{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.card-name{font-size:22px;font-weight:200;text-transform:uppercase;letter-spacing:-.005em;line-height:1.05}
.card-lede{margin-top:8px;color:var(--fg2);font-size:13px;line-height:1.5}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(120% 80% at 20% 20%,rgba(248,104,1,.12),transparent 55%),
    linear-gradient(180deg,var(--navy2),var(--navy))}
.placeholder .ini{font-size:72px;font-weight:200;letter-spacing:-.02em;color:var(--fg)}
.placeholder .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3)}

.scrim{position:fixed;inset:0;background:rgba(6,9,26,.72);backdrop-filter:blur(6px);
  z-index:100;opacity:0;pointer-events:none;transition:opacity 480ms var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);z-index:110;
  background:var(--navy);border-left:1px solid var(--hair);
  transform:translateX(100%);transition:transform 900ms var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;
  padding:22px 36px;border-bottom:1px solid var(--hair);flex-shrink:0}
.drawer-num{font-size:11px;letter-spacing:.18em;color:var(--fg3);font-variant-numeric:tabular-nums}
.close-btn{width:38px;height:38px;border:1px solid var(--hair2);background:transparent;
  color:var(--fg);border-radius:999px;cursor:pointer;display:grid;place-items:center;
  transition:all 240ms var(--ease)}
.close-btn:hover{border-color:var(--accent);color:var(--accent)}
.close-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.4;fill:none}
.drawer-scroll{flex:1;overflow-y:auto;padding:36px}
.drawer-portrait{position:relative;aspect-ratio:16/10;overflow:hidden;
  background:var(--navy2);border:1px solid var(--hair);margin-bottom:36px}
.drawer-portrait img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 20%;filter:saturate(.9)contrast(1.03)}
.drawer-portrait::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(6,9,26,.6))}
.d-role{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.d-name{font-size:clamp(36px,5vw,58px);font-weight:200;letter-spacing:-.015em;
  line-height:.96;text-transform:uppercase;margin-bottom:28px;text-wrap:balance}
.d-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:18px 0;margin-bottom:36px}
.fact .fl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);margin-bottom:5px}
.fact .fv{font-size:14px;font-weight:300;color:var(--fg);line-height:1.3}
.d-bio p{font-size:15px;line-height:1.7;color:var(--fg2);margin-bottom:18px;font-weight:300;text-wrap:pretty}
.d-bio p:first-child{font-size:18px;line-height:1.6;color:var(--fg)}
.d-bio p:first-child::first-letter{color:var(--accent)}
@media(max-width:540px){.drawer-head,.drawer-scroll{padding:18px 20px}.d-facts{grid-template-columns:1fr;gap:14px}}

.cta{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:96px 0;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;bottom:-30%;left:-5%;
  width:60vw;height:50vw;max-width:800px;
  background:radial-gradient(closest-side,rgba(248,104,1,.18),rgba(248,104,1,.04) 45%,transparent 70%);
  filter:blur(18px);pointer-events:none}
.cta-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.cta h3{font-size:clamp(32px,4.5vw,64px);font-weight:200;text-transform:uppercase;
  letter-spacing:-.015em;line-height:1;text-wrap:balance}
.cta-btns{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:14px 24px;
  border-radius:4px;font-weight:300;font-family:inherit;cursor:pointer;border:0;
  transition:all 240ms var(--ease)}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:#e66c07;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--hair2)}
.btn-ghost:hover{border-color:var(--fg)}
@media(max-width:720px){.cta{padding:64px 0}.cta-inner{grid-template-columns:1fr;gap:28px}}

.foot{padding:48px 0 56px;display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.foot a{color:var(--fg3);text-decoration:none}
.foot a:hover{color:var(--fg)}
.foot-links{display:flex;gap:28px}
.logo-mark{display:flex;align-items:center;gap:10px}
.logo-txt{font-size:11px;letter-spacing:.2em;font-weight:200;color:var(--fg3)}

body.no-scroll{overflow:hidden}
</style>

xclusively on multifamily renovations, developing deep expertise in scope management, subcontractor coordination, and project delivery at scale.","As Director of Field Operations, she bridges the gap between the field and ownership, ensuring seamless execution across the supply and logistics chain."],facts:[["Industry","15 years"],["Focus","Multifamily renovations"],["Scope","Multi-market delivery"]]},{slug:"elishia-georgiou",name:"Elishia Georgiou",role:"Director of Operations and Logistics",group:"Operations",photo:"",lede:"Where there is no system, she builds one.",bio:["Elishia Georgiou serves as Director of Operations and Logistics at ChronosBuild, building the operational backbone and systems the company needs to scale.","With a background spanning business operations, multifamily, compliance, training, and process development, she has built her career around making organizations work better\u2014from developing leaders to creating policies and processes that teams can actually use.","Known for finding the problem behind the problem, Elishia quickly identifies operational gaps and turns messy processes into clear, repeatable systems. She brings structure, accountability, and practical solutions that help teams perform and organizations scale. Where there is no system, she builds one."],facts:[["Operations","Systems & Infrastructure"],["Expertise","Process \u00b7 Compliance \u00b7 Leadership"],["Focus","Systems That Scale"]]},{slug:"anny-ma",name:"Anny Ma",role:"Partner — Creative Director",group:"Leadership",photo:"https://static.wixstatic.com/media/4adca7_dc2631e9c6bf4cfdbf42c7196b8b560d~mv2.png",lede:"Engineer and artist defining the design language of the built environment.",bio:["Anny Ma is the Creative Director of ChronosBuild, where she defines the creative vision behind next-generation product lines and the design language shaping the future of the built environment.","Born in Taiwan and raised in Canada, Anny earned her degree in Engineering from Queen sational administration.","Early in her career she worked with a SaaS company in Central America, helping coordinate CRM software solutions. She later served as a project manager for a Miami general contractor, overseeing commercial and residential construction projects.","Crabtree now oversees the strategic and operational affairs of the Crabtree family's business interests and serves as business manager for Crabtree, Auslander & Tackenberg."],facts:[["Domain","Operations · Tech · Construction"],["Role","Family enterprise"],["Firm","Crabtree, Auslander & Tackenberg"]]}];

var GROUPS=["All","Leadership","Operations","Board"];

/* ----------------------------------------------------------------------
   Tiny DOM helpers (no framework, no build step)
---------------------------------------------------------------------- */
function el(tag,attrs,children){
  var n=document.createElement(tag);
  if(attrs){for(var k in attrs){
    if(k==="class")n.className=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k==="html")n.innerHTML=attrs[k];
    else n.setAttribute(k,attrs[k]);
  }}
  if(children){for(var i=0;i<children.length;i++){
    var c=children[i];
    if(c==null)continue;
    n.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }}
  return n;
}
function initials(name){return name.split(" ").map(function(s){return s[0];}).join("");}
function pad(n){return String(n).padStart(2,"0");}

var PLUS_SVG='<svg viewBox="0 0 14 14"><path d="M3 7h8M7 3v8"/></svg>';

/* ----------------------------------------------------------------------
   State + counts
---------------------------------------------------------------------- */
var filter="All";
var counts={All:TEAM.length};
TEAM.forEach(function(p){counts[p.group]=(counts[p.group]||0)+1;});

/* ----------------------------------------------------------------------
   Cards
---------------------------------------------------------------------- */
function buildCard(p,idx,total){
  var imgEl=p.photo
    ? el("img",{src:p.photo,alt:p.name,loading:"lazy"})
    : el("div",{class:"placeholder"},[
        el("div",{class:"ini",text:initials(p.name)}),
        el("div",{class:"hint",text:"Portrait forthcoming"})
      ]);
  var btn=el("button",{class:"card","data-slug":p.slug},[
    el("div",{class:"card-img"},[
      el("span",{class:"card-num",text:pad(idx+1)+" / "+pad(total)}),
      imgEl,
      el("div",{class:"card-plus",html:PLUS_SVG})
    ]),
    el("div",{class:"card-body"},[
      el("div",{class:"card-role",text:p.role}),
      el("div",{class:"card-name",text:p.name}),
      el("div",{class:"card-lede",text:p.lede})
    ])
  ]);
  btn.addEventListener("click",function(){openDrawer(p);});
  return btn;
}

function renderGrid(){
  grid.innerHTML="";
  var list=filter==="All"?TEAM:TEAM.filter(function(p){return p.group===filter;});
  list.forEach(function(p){
    var idx=TEAM.findIndex(function(x){return x.slug===p.slug;});
    grid.appendChild(buildCard(p,idx,TEAM.length));
  });
}

/* ----------------------------------------------------------------------
   Filter tabs
---------------------------------------------------------------------- */
function renderFilter(){
  filterBar.innerHTML="";
  GROUPS.forEach(function(g){
    var b=el("button",{class:filter===g?"on":""},[
      g,
      el("span",{class:"ct",text:String(counts[g]||0)})
    ]);
    b.addEventListener("click",function(){
      filter=g;
      renderFilter();
      renderGrid();
    });
    filterBar.appendChild(b);
  });
}

/* ----------------------------------------------------------------------
   Drawer
---------------------------------------------------------------------- */
function openDrawer(p){
  var idx=TEAM.findIndex(function(x){return x.slug===p.slug;});

  var portraitInner=p.photo

        el("div",{class:"ini",style:"font-size:100px",text:initials(p.name)})
      ]);

  drawerScroll.innerHTML="";
  drawerScroll.appendChild(el("div",{class:"drawer-portrait"},[portraitInner]));
  drawerScroll.appendChild(el("div",{class:"d-role",text:p.role}));
  drawerScroll.appendChild(el("h2",{class:"d-name",text:p.name}));

  var facts=el("div",{class:"d-facts"});
  p.facts.forEach(function(f){
    facts.appendChild(el("div",{class:"fact"},[
      el("div",{class:"fl",text:f[0]}),
      el("div",{class:"fv",text:f[1]})
    ]));
  });
  drawerScroll.appendChild(facts);

  var bio=el("div",{class:"d-bio"});
  p.bio.forEach(function(par){bio.appendChild(el("p",{text:par}));});
  drawerScroll.appendChild(bio);

  drawerScroll.scrollTop=0;
  scrim.classList.add("open");
  drawer.classList.add("open");
  document.body.classList.add("no-scroll");
}

function closeDrawer(){
  scrim.classList.remove("open");
  drawer.classList.remove("open");
  document.body.classList.remove("no-scroll");
}

document.getElementById("close-btn").addEventListener("click",closeDrawer);
scrim.addEventListener("click",closeDrawer);
window.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer();});

/* ----------------------------------------------------------------------
   Boot
---------------------------------------------------------------------- */
renderFilter();
renderGrid();
</script>
</body>
</html>
